<!DOCTYPE html>
<html>
<head>
    <title>script
    </title>
</head>
<body>
    <button id="btn">Click Me</button>
    
</body>
<script type="text/javascript">
        let btn=document.getElementById("btn");
         btn.addEventListener("click",clickBtn);
         
        function clickBtn(){
            btn.style.backgroundColor="red";
        }
        </script>
</html>
