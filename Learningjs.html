<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Js</title>
</head>
<body>
    <input type="number" placeholder="Enter Your Text" id="Wycliff"><br><br>
    <button ondblClick="test()" id="btn">Click me</button>
</body>
<script type="text/javascript">
    function test(){
        let testNumber=Number(document.getElementById("Wycliff").value);
        testNumber=Number(testNumber);
        switch(testNumber){
            case 10:
                alert("This is case 10");
                break;

            case 20:
                alert("This is case 20");
                break;
            case 30:
                alert("This is case 30");
                break;
            default:
                alert("Value Not Found")
        }
    }
    let btn=document.getElementById("btn");
    btn.addEventListener("click",test);
</script>
</html>
