<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoopTest</title>
</head>
<body>
    <p id="display">This is a Loop Test<br></p>
    <button id="btn" onclick="LoopTest()">ClickHere</button>
</body>
<script type="text/javascript">
    function LoopTest(){
        let display=document.getElementById("display");
        let range;
        var count=0;
        for(range=0;range<=30;range++){
            if(range%2==0){
                if(range==14 || range==18){
                    continue;
                }
            else{
                count=count+1;
                if(count%4==0){
                    display.innerHTML+=`<br><br>`${range}`
                }
            else{
                display.innerHTML +=`${range}`
            }
            }
            
        }
    }
}
</script>
</html>
